name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Test
        run: pytest -q

  benchmark-smoke:
    # The suite has to stay reproducible, so CI regenerates a slice of it and
    # checks the classical arms still behave. Training is not run in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regenerate the suite and score the classical arms
        run: |
          python -m bahn.cli maps
          python -m bahn.cli eval --split test --arm reactive-hand dwa dwa+cbf --batch 20
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: results/summary.json
